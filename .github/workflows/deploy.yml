name: Mise en ligne sur Gandi

# À chaque fusion sur main (article validé), le site est reconstruit et envoyé sur l'hébergement Gandi.
# Tourne aussi chaque matin pour publier à 8h30 (heure de Paris) l'article programmé ce jour-là (le mardi en général).
# Deux horaires car GitHub est en UTC et Paris change d'heure (été UTC+2 / hiver UTC+1) :
# le build ne publie un article qu'une fois 8h30 passé à Paris, l'autre passage ne change rien.
on:
  push:
    branches: [main]
  schedule:
    - cron: '32 6 * * *'   # 8h32 en été
    - cron: '32 7 * * *'   # 8h32 en hiver
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Envoi SFTP vers Gandi
        env:
          HOST: ${{ secrets.GANDI_SFTP_HOST }}
          USER: ${{ secrets.GANDI_SFTP_USER }}
          PASS: ${{ secrets.GANDI_SFTP_TOKEN }}
          DIR:  ${{ secrets.GANDI_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Pas de --delete : on ajoute/remplace, on ne supprime jamais rien sur le serveur.
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --verbose --only-newer --no-perms dist/ $DIR;
            bye"
