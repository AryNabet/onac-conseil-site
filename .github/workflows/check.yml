name: Vérification de l'article

# Sur chaque proposition d'article (pull request), vérifie que le site se construit sans erreur
# (en-tête complet, date valide, pas de doublon) avant que l'article puisse être validé.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
